<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Abrir en HaNet</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #282829; color: #dddde2; font-family: Inter, Arial, sans-serif; text-align: center; }
  main { max-width: 360px; padding: 24px; }
  h1 { font-family: 'DM Sans', Arial, sans-serif; font-size: 26px; line-height: 32px; color: #f9f9fa; margin: 32px 0 12px; }
  p { font-size: 15px; line-height: 22px; margin: 0 0 24px; }
  a.button { display: block; padding: 20px; border-radius: 60px; background: #ef2274; color: #282829; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main>
<img src="/email/hanet-logo-blanco.png" alt="HaNet" width="147" height="40">
<h1>Abriendo HaNet…</h1>
<p>Si la app no se abre sola, tócala abajo. Necesitas tener HaNet instalada en este teléfono.</p>
<a class="button" id="open" href="hanetcl://">Abrir en HaNet</a>
</main>
<script>
  // "Ver detalles" in ClassHall emails: ?r=classhall/task?hallId=…&id=… opens that screen in the app.
  // Only ClassHall's own screens, so the page cannot be used to open anything else.
  var route = new URLSearchParams(location.search).get("r") || "";
  var target = /^classhall\/(hall|task)\?[A-Za-z0-9_=&-]+$/.test(route) ? "hanetcl://" + route : "hanetcl://";
  document.getElementById("open").href = target;
  location.replace(target);
</script>
</body>
</html>
