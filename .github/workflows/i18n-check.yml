name: Textos traducibles

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Los textos pasan por t()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Fails with the list of texts written straight into the code.
      # Fix: npm run i18n:extract (moves them to i18n/locales/es.json).
      - name: Look for hardcoded texts
        run: npm run i18n:check
