name: Version bump

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Version went up
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compare against the base branch
        run: node scripts/version.js check "origin/${{ github.base_ref }}"
