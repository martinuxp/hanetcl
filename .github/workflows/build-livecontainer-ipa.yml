name: Build LiveContainer IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iPhone app
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CI: "1"
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      EXPO_NO_TELEMETRY: "1"
      NODE_ENV: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install JavaScript dependencies
        run: npm ci --include=dev

      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Build an unsigned iPhone application
        shell: bash
        run: |
          set -euo pipefail

          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [[ -z "$workspace" ]]; then
            echo "No Xcode workspace was generated."
            exit 1
          fi

          scheme="$(basename "$workspace" .xcworkspace)"

          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package the application as an IPA
        shell: bash
        run: |
          set -euo pipefail

          app_path="$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "The iPhone .app bundle was not generated."
            exit 1
          fi

          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Info.plist")"
          file "$app_path/$executable_name"

          mkdir -p artifact/Payload
          cp -R "$app_path" artifact/Payload/
          cd artifact
          zip -qry ../HaNet-LiveContainer.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HaNet-LiveContainer
          path: HaNet-LiveContainer.ipa
          if-no-files-found: error
          retention-days: 14
