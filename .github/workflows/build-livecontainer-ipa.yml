name: Build LiveContainer IPA

on:
  workflow_dispatch:
    inputs:
      app_group:
        description: "Opcional. App Group del certificado que firma la app. Vacío = group.art.muxp.hanetcl (la app igual toma el grupo que le dé la firma)."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iPhone app
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CI: "1"
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      EXPO_NO_TELEMETRY: "1"
      NODE_ENV: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install JavaScript dependencies
        run: npm ci --include=dev

      - name: Generate the native iOS project
        env:
          HANET_APP_GROUP: ${{ github.event.inputs.app_group }}
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Build an unsigned iPhone application
        shell: bash
        run: |
          set -euo pipefail

          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [[ -z "$workspace" ]]; then
            echo "No Xcode workspace was generated."
            exit 1
          fi

          scheme="$(basename "$workspace" .xcworkspace)"

          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # Without a signature the IPA carries no entitlements, so whatever signs
      # it on the phone doesn't know the app and the widget share an App Group
      # and they get none: the widget never updates and the Live Activity
      # shows up empty. An ad-hoc signature (no certificate) keeps the
      # entitlements in the binaries for the signer to read. aps-environment
      # goes out: Apple only delivers push to builds signed by HaNet's own
      # developer account, and some signers refuse to install with it.
      - name: Ad-hoc sign with the entitlements
        shell: bash
        run: |
          set -euo pipefail

          app_path="$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          app_name="$(basename "$app_path" .app)"
          entitlements_dir="$(mktemp -d)"

          entitlements_for() {
            local source="$1" target="$2"
            cp "$source" "$target"
            /usr/libexec/PlistBuddy -c 'Delete :aps-environment' "$target" 2>/dev/null || true
            plutil -p "$target"
          }

          # Inside out: frameworks and dylibs, then the extensions, then the app.
          while IFS= read -r -d '' nested; do
            codesign --force --sign - --timestamp=none "$nested"
          done < <(find "$app_path" \( -name '*.framework' -o -name '*.dylib' \) -print0)

          for appex in "$app_path"/PlugIns/*.appex; do
            [[ -e "$appex" ]] || continue
            target_name="$(basename "$appex" .appex)"
            target_entitlements="$entitlements_dir/$target_name.plist"
            if [[ -f "ios/$target_name/$target_name.entitlements" ]]; then
              entitlements_for "ios/$target_name/$target_name.entitlements" "$target_entitlements"
              codesign --force --sign - --timestamp=none --entitlements "$target_entitlements" "$appex"
            else
              codesign --force --sign - --timestamp=none "$appex"
            fi
          done

          app_entitlements="$entitlements_dir/$app_name.plist"
          entitlements_for "ios/$app_name/$app_name.entitlements" "$app_entitlements"
          codesign --force --sign - --timestamp=none --entitlements "$app_entitlements" "$app_path"

          codesign --display --entitlements - "$app_path"
          for appex in "$app_path"/PlugIns/*.appex; do
            [[ -e "$appex" ]] && codesign --display --entitlements - "$appex"
          done

      - name: Package the application as an IPA
        shell: bash
        run: |
          set -euo pipefail

          app_path="$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "The iPhone .app bundle was not generated."
            exit 1
          fi

          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Info.plist")"
          file "$app_path/$executable_name"

          mkdir -p artifact/Payload
          cp -R "$app_path" artifact/Payload/
          cd artifact
          zip -qry ../HaNet-LiveContainer.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HaNet-LiveContainer
          path: HaNet-LiveContainer.ipa
          if-no-files-found: error
          retention-days: 14
